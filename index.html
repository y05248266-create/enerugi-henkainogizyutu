        // Web Audio API によるサウンド効果
        const playSound = (freq = 440, type = 'sine', duration = 0.08) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Audio interaction safeguard
            }
        };

                        <span class="bg-slate-200 px-2.5 py-0.5 rounded-full text-slate-700">現在のスコア: ${quizScore}</span>
                    </div>

                    <!-- Question Box -->
                    <div class="bg-amber-50/60 border border-amber-200 rounded-2xl p-4">
                        <h3 class="font-bold text-slate-800 text-base sm:text-lg mb-3">
                            ${qData.q}
                        </h3>

                        <!-- Options -->
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5" id="interactiveQuizOptions">
                            ${qData.options.map((opt, i) => `
                                <button onclick="answerInteractiveQuiz(${i})" class="quiz-opt-btn bg-white hover:bg-amber-100/70 border border-slate-300 rounded-xl p-3 text-xs sm:text-sm font-semibold text-slate-700 transition text-left flex items-center justify-between">
                                    <span>${opt}</span>
                                    <i class="fa-regular fa-circle text-slate-300 text-xs"></i>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Result Explanations -->
                        <div id="interactiveQuizResult" class="hidden mt-3 p-3 rounded-xl text-xs font-semibold leading-relaxed"></div>
                    </div>

                    <!-- Next Quiz Btn -->
                    <div class="text-right">
                        <button id="nextQuizBtn" onclick="nextQuizQuestion()" disabled class="bg-slate-300 text-slate-500 cursor-not-allowed font-bold px-5 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5 ml-auto">
                            <span>次の問題へ</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function answerInteractiveQuiz(selectedIdx) {
            if (quizAnswered) return;
            quizAnswered = true;

            const qData = quizQuestions[currentQuizIdx];
            const isCorrect = selectedIdx === qData.answer;
            const resBox = document.getElementById('interactiveQuizResult');
            const nextBtn = document.getElementById('nextQuizBtn');
            const btns = document.querySelectorAll('#interactiveQuizOptions .quiz-opt-btn');

            btns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.add('opacity-60');
                if (idx === qData.answer) {
                    btn.classList.remove('opacity-60', 'bg-white');
                    btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.remove('opacity-60', 'bg-white');
                    btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                }
            });

            resBox.classList.remove('hidden');
            if (isCorrect) {
                quizScore++;
                playSound(880, 'triangle', 0.25);
                resBox.className = "mt-3 p-3 rounded-xl text-xs font-semibold leading-relaxed bg-emerald-100 text-emerald-950 border border-emerald-300";
                resBox.innerHTML = `⭕ <b>正解！</b> ${qData.desc}`;
            } else {
                playSound(220, 'sawtooth', 0.25);
                resBox.className = "mt-3 p-3 rounded-xl text-xs font-semibold leading-relaxed bg-rose-100 text-rose-950 border border-rose-300";
                resBox.innerHTML = `❌ <b>不正解！</b> 正解は「${qData.options[qData.answer]}」でした。<br>${qData.desc}`;
            }

            nextBtn.disabled = false;
            nextBtn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5 ml-auto shadow active:scale-95";
        }

        function nextQuizQuestion() {
            currentQuizIdx++;
            quizAnswered = false;
            renderSlide(currentSlideIndex);
        }

        function resetQuiz() {
            currentQuizIdx = 0;
            quizScore = 0;
            quizAnswered = false;
            renderSlide(currentSlideIndex);
        }

        let currentSlideIndex = 0;
        const totalSlides = slidesData.length;

        // UI DOM Elements
        const slideContentEl = document.getElementById('slideContent');
        const currentSlideNumEl = document.getElementById('currentSlideNum');
        const totalSlideNumEl = document.getElementById('totalSlideNum');
        const progressBarEl = document.getElementById('progressBar');
        const dotIndicatorsEl = document.getElementById('dotIndicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indexModal = document.getElementById('indexModal');
        const modalIndexList = document.getElementById('modalIndexList');

        // スライド描画処理
        function renderSlide(index) {
            const slide = slidesData[index];
            
            // Header slide info
            currentSlideNumEl.textContent = index + 1;
            totalSlideNumEl.textContent = totalSlides;

            // Progress bar calculation
            const progressPercent = ((index + 1) / totalSlides) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            // HTML Structure for slide header & dynamic content
            slideContentEl.className = "slide-enter flex-grow flex flex-col justify-between";
            slideContentEl.innerHTML = `
                <div>
                    <!-- Slide Tag Badge -->
                    <div class="mb-2">
                        <span class="bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1 rounded-full inline-flex items-center gap-1.5 border border-amber-300">
                            <i class="fa-solid fa-bookmark text-amber-600"></i>
                            ${slide.tag}
                        </span>
                    </div>
                    
                    <!-- Slide Title & Subtitle -->
                    <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">
                        ${slide.title}
                    </h2>
                    <p class="text-slate-500 text-xs sm:text-sm mt-1 mb-4 font-medium">
                        ${slide.subtitle}
                    </p>

                    <!-- Slide Main Inner View -->
                    ${slide.render()}
                </div>
            `;

            // Navigation buttons state
            prevBtn.disabled = index === 0;
            if (index === totalSlides - 1) {
                nextBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600', 'text-slate-950');
                nextBtn.classList.add('bg-slate-700', 'hover:bg-slate-800', 'text-white');
            } else {
                nextBtn.classList.remove('bg-slate-700', 'hover:bg-slate-800', 'text-white');
                nextBtn.classList.add('bg-amber-500', 'hover:bg-amber-600', 'text-slate-950');
            }

            // Update dot indicators
            updateDots(index);
        }

        // ドットインジケーターの作成＆更新
        function createDots() {
            dotIndicatorsEl.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-200 ${i === currentSlideIndex ? 'bg-amber-500 w-6' : 'bg-slate-300 hover:bg-slate-400'}`;
                dot.title = `スライド ${i + 1}`;
                dot.onclick = () => jumpToSlide(i);
                dotIndicatorsEl.appendChild(dot);
            }
        }

        function updateDots(activeIndex) {
            const dots = dotIndicatorsEl.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === activeIndex) {
                    dots[i].className = "w-6 h-3 bg-amber-500 rounded-full transition-all duration-200";
                } else {
                    dots[i].className = "w-3 h-3 bg-slate-300 hover:bg-slate-400 rounded-full transition-all duration-200";
                }
            }
        }

        // スライド切り替え関数
        function changeSlide(direction) {
            const newIndex = currentSlideIndex + direction;
            if (newIndex >= 0 && newIndex < totalSlides) {
                playSound(500 + direction * 100);
                currentSlideIndex = newIndex;
                renderSlide(currentSlideIndex);
            }
        }

        function jumpToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                playSound(550);
                currentSlideIndex = index;
                renderSlide(currentSlideIndex);
                closeIndexModal();
            }
        }

        // 目次モーダル操作
        function openIndexModal() {
            playSound(600);
            modalIndexList.innerHTML = slidesData.map((s, idx) => `
                <button onclick="jumpToSlide(${idx})" class="p-3 text-left rounded-xl border ${idx === currentSlideIndex ? 'border-amber-500 bg-amber-50/80 font-bold' : 'border-slate-200 hover:bg-slate-50'} transition flex items-center justify-between group">
                    <div>
                        <span class="text-xs font-bold text-amber-600 block">${s.tag}</span>
                        <span class="text-sm text-slate-800">${s.title}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-amber-500 transition"></i>
                </button>
            `).join('');

            indexModal.classList.remove('hidden');
            setTimeout(() => {
                indexModal.classList.remove('opacity-0');
            }, 10);
        }

        function closeIndexModal() {
            indexModal.classList.add('opacity-0');
            setTimeout(() => {
                indexModal.classList.add('hidden');
            }, 200);
        }

        // フルスクリーン切り替え
        function toggleFullscreen() {
            playSound(650);
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
                document.getElementById('fullscreenIcon').className = "fa-solid fa-compress";
                document.getElementById('fullscreenText').textContent = "標準";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreenIcon').className = "fa-solid fa-expand";
                    document.getElementById('fullscreenText').textContent = "大画面";
                }
            }
        }

        // キーボード操作サポート
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                changeSlide(1);
            } else if (e.key === 'ArrowLeft') {
                changeSlide(-1);
            } else if (e.key === 'Escape') {
                closeIndexModal();
            }
        });

        // アプリ初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            createDots();
            renderSlide(currentSlideIndex);
        });
    </script>
</body>
</html>
